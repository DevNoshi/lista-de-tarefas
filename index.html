<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>System Tasks // Secure Interface</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">// Estou finalizando, guenta ai</h1>
            <div class="controls">
                <select id="langSelector">
                    <option value="pt">PT-BR</option>
                    <option value="en">EN-US</option>
                </select>
                <button id="toggleDarkMode">MODO_LUZ/TREVAS</button>
            </div>
        </header>

        <section class="task-input-area">
            <input type="text" id="taskInput" placeholder="> NOVA_TAREFA...">
            <button id="addTaskBtn">[EXECUTAR]</button>
        </section>

        <ul id="taskList"></ul>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
