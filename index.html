<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="grain"></div>
    <main class="viewport">
        <header class="sys-header">
            <h1>// Organize Sua Rotina</h1>
            <div id="clock">00:00:00</div>
        </header>

        <section class="cmd-center">
            <input type="text" id="taskInput" placeholder="> NOME_DA_MISSÃO..." autofocus>
            <div class="row">
                <input type="datetime-local" id="taskDate">
                <select id="taskPriority">
                    <option value="low">Normal</option>
                    <option value="medium">Média</option>
                    <option value="high">Alta</option>
                </select>
                <button id="addTaskBtn">[Iniciar]</button>
            </div>
        </section>

        <ul id="taskList"></ul>

        <footer class="sys-footer">
            <div class="progress-track"><div id="prog-bar"></div></div>
            <p>SISTEMA: OPERACIONAL | TAREFAS: <span id="count">0</span></p>
        </footer>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
